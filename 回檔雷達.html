<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="回檔雷達" />
<meta name="theme-color" content="#060708" />
<title>回檔雷達</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #060708;
    --panel: #0c0e11;
    --hair: rgba(255,255,255,0.075);
    --hair-2: rgba(255,255,255,0.14);
    --text: #EAECEF;
    --text-2: #868D98;
    --text-3: #565D68;
    --blue: #2F81F7;
    --blue-2: #1f6fe0;
    --up: #FF4D4D;
    --down: #20D17E;
    --sev-mild: #E8EAED;
    --sev-warn: #FF9500;
    --sev-bad: #FF2D2D;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    background: var(--bg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #root {
    height: 100dvh; width: 100%;
    display: flex; flex-direction: column;
  }

  /* ── app shell ───────────────────────────────────────────── */
  .app {
    height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    font-family: var(--sans);
  }
  .appbar {
    padding-top: calc(var(--safe-top) + 12px);
    background: linear-gradient(180deg, #0e1116, var(--panel));
    border-bottom: 1px solid var(--hair);
    position: relative; z-index: 6;
    flex-shrink: 0;
  }
  .appbar-row {
    padding: 2px 16px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--blue); position: relative;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 4px rgba(47,129,247,0.10);
  }
  .bm-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
  .bm-dot::after {
    content: ''; position: absolute; inset: -1.5px; border-radius: 50%;
    background: var(--blue); opacity: .5; animation: ping 2.4s ease-out infinite;
  }
  .brand h1 { font-size: 19px; font-weight: 700; letter-spacing: 1px; }
  .add-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--blue); color: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(47,129,247,0.35);
    transition: transform .14s; flex-shrink: 0;
  }
  .add-btn:active { transform: scale(0.92); }

  .statusbar {
    display: flex; align-items: center;
    padding: 7px 18px 10px;
  }
  .sb-session { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; }
  .sb-session.is-open { color: var(--text-2); }
  .sb-session.is-closed { color: var(--text-3); }
  .sb-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; position: relative; }
  .is-open .sb-dot { background: var(--down); }
  .is-open .sb-dot::after {
    content: ''; position: absolute; inset: -2px; border-radius: 50%;
    background: var(--down); opacity: .5; animation: ping 1.8s ease-out infinite;
  }
  .is-closed .sb-dot { background: var(--text-3); }
  .sb-updated { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); letter-spacing: .3px; }

  /* ── scroll + list ───────────────────────────────────────── */
  .scroll {
    flex: 1; overflow-y: auto; position: relative;
    touch-action: pan-y; -webkit-overflow-scrolling: touch;
  }
  .scroll::-webkit-scrollbar { width: 0; }
  .ptr {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 7px; overflow: hidden; padding-bottom: 6px;
  }
  .ptr-radar {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--hair-2); border-top-color: var(--blue);
  }
  .ptr-radar.ready { border-top-color: var(--down); }
  .ptr-text { font-size: 11px; color: var(--text-3); }
  .list-inner { position: relative; }

  .row-wrap { position: relative; overflow: hidden; }
  .row { position: relative; background: var(--bg); }
  .row-delete {
    position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(90deg, #7a1416, var(--sev-bad));
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 26px; color: #fff;
  }
  .row-delete span { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
  .row-face {
    position: relative; z-index: 1; background: var(--bg);
    border-bottom: 1px solid var(--hair);
    will-change: transform;
  }
  .row.dragging { z-index: 30; }
  .row.dragging .row-face {
    background: #14171d; border-bottom-color: transparent;
    box-shadow: 0 14px 30px rgba(0,0,0,0.55), 0 0 0 1px var(--hair-2);
    border-radius: 12px;
  }
  .row.flash .row-face { animation: rowflash 1.4s ease-out; }

  .row-top {
    display: flex; flex-direction: column;
    padding: 10px 14px 10px 16px;
  }
  .drag-grip {
    position: absolute; left: 1px; top: 16px; opacity: 0;
    transition: opacity .15s; pointer-events: none;
  }
  .row.dragging .drag-grip { opacity: .7; }

  /* 第一行：代號 + 名稱 */
  .r-header { display: flex; align-items: baseline; gap: 8px; min-width: 0; margin-bottom: 7px; }
  .r-code { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--blue); letter-spacing: .3px; flex-shrink: 0; }
  .r-nm { font-size: 16px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ext-link {
    display: inline-flex; align-items: center; flex-shrink: 0;
    margin-left: 2px; padding: 2px; color: var(--text-3); cursor: pointer;
    transition: color .15s; text-decoration: none;
  }
  .ext-link:active { color: var(--blue); }

  /* 第二行：三欄等寬，頂部對齊 */
  .r-data { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: start; }

  /* 共用標籤樣式 */
  .r-col-lbl { font-size: 9.5px; color: var(--text-3); letter-spacing: .4px; white-space: nowrap; margin-bottom: 3px; }

  /* 第一欄：3年高 */
  .r-sub { display: flex; flex-direction: column; }
  .r-sub-val { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; line-height: 1; }

  /* 第二欄：現價 */
  .r-price { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .r-now { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 3px; }
  .r-ret { font-family: var(--mono); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }

  /* 第三欄：下一關卡 */
  .r-next { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
  .r-next-price { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 3px; }
  .r-next-pct { font-family: var(--mono); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }

  .row-detail {
    padding: 0 16px 16px; display: flex; flex-direction: column; gap: 13px;
    animation: detailin .22s ease-out;
  }
  .detail-stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .ds-item { display: flex; flex-direction: column; gap: 4px; }
  .ds-k { font-size: 10.5px; color: var(--text-3); letter-spacing: .3px; }
  .ds-v { font-family: var(--mono); font-size: 13.5px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .ladder { display: flex; gap: 5px; flex-wrap: wrap; }
  .lad {
    font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 5px;
    border: 1px solid var(--hair); color: var(--text-3); font-variant-numeric: tabular-nums;
  }
  .lad.passed { background: rgba(255,82,87,0.13); border-color: transparent; color: var(--sev-bad); }
  .lad.next { background: rgba(47,129,247,0.12); border-color: var(--blue); color: var(--blue); font-weight: 600; }

  .list-foot {
    text-align: center; color: var(--text-3); font-size: 11px;
    padding: 18px 0 calc(34px + var(--safe-bottom)); letter-spacing: .3px;
  }

  /* ── empty state ─────────────────────────────────────────── */
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 40px calc(64px + var(--safe-bottom)); text-align: center; }
  .empty-radar { width: 152px; height: 152px; position: relative; margin-bottom: 32px; }
  .er-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); border-radius: 50%; border: 1px solid rgba(47,129,247,0.22); }
  .er-r1 { width: 152px; height: 152px; }
  .er-r2 { width: 102px; height: 102px; }
  .er-r3 { width: 54px; height: 54px; }
  .er-sweep {
    position: absolute; top: 50%; left: 50%; width: 152px; height: 152px;
    background: conic-gradient(from 0deg, rgba(47,129,247,0.45), rgba(47,129,247,0.0) 70deg);
    border-radius: 50%; animation: spinc 3.2s linear infinite;
  }
  .er-core { position: absolute; top: 50%; left: 50%; width: 9px; height: 9px; transform: translate(-50%,-50%); border-radius: 50%; background: var(--blue); box-shadow: 0 0 12px var(--blue); }
  .er-blip { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--sev-warn); }
  .er-b1 { top: 34px; left: 104px; animation: blip 2.4s ease-in-out infinite; }
  .er-b2 { top: 96px; left: 46px; background: var(--sev-bad); animation: blip 2.4s ease-in-out infinite .9s; }
  .empty-title { font-size: 23px; font-weight: 700; margin: 0 0 14px; letter-spacing: 1px; }
  .empty-sub { font-size: 14.5px; color: var(--text-2); line-height: 1.9; margin: 0 0 30px; }
  .empty-cta {
    display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 22px;
    background: var(--blue); color: #fff; border: none; border-radius: 13px;
    font-size: 16px; font-weight: 600; font-family: var(--sans); cursor: pointer;
    box-shadow: 0 8px 24px rgba(47,129,247,0.4); transition: transform .14s;
  }
  .empty-cta:active { transform: scale(0.96); }
  .empty-hint { margin-top: 18px; font-size: 12px; color: var(--text-3); }

  /* ── search sheet ────────────────────────────────────────── */
  .sheet-scrim {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(3px);
    display: flex; align-items: flex-end; animation: fade .2s ease-out;
  }
  .sheet {
    width: 100%; height: 88%; background: #0b0d10;
    border-radius: 22px 22px 0 0; border-top: 1px solid var(--hair-2);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 -20px 50px rgba(0,0,0,0.5);
    animation: sheetup .3s cubic-bezier(.2,.85,.25,1);
    padding-bottom: var(--safe-bottom);
  }
  .sheet-grab { width: 38px; height: 4px; border-radius: 2px; background: var(--hair-2); margin: 9px auto 5px; flex-shrink: 0; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 6px 16px 12px; border-bottom: 1px solid var(--hair); flex-shrink: 0; }
  .search-box {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 12px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--hair); border-radius: 12px;
    transition: border-color .15s;
  }
  .search-box:focus-within { border-color: var(--blue); }
  .search-input {
    flex: 1; min-width: 0; background: none; border: none; outline: none;
    color: var(--text); font-size: 15.5px; font-family: var(--sans);
  }
  .search-input::placeholder { color: var(--text-3); }
  .search-clear { background: none; border: none; color: var(--text-3); font-size: 13px; width: 22px; height: 22px; cursor: pointer; }
  .sheet-cancel { background: none; border: none; color: var(--blue); font-size: 15.5px; font-weight: 500; padding: 6px 2px; cursor: pointer; flex-shrink: 0; }
  .results { flex: 1; overflow-y: auto; padding: 2px 0 24px; }
  .results::-webkit-scrollbar { width: 0; }
  .res-row {
    width: 100%; display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 12px;
    padding: 12px 16px; background: none; border: none; border-bottom: 1px solid var(--hair);
    text-align: left; cursor: pointer; color: var(--text); font-family: var(--sans);
  }
  .res-row:active:not(:disabled) { background: rgba(255,255,255,0.03); }
  .res-row:disabled { opacity: .5; cursor: default; }
  .res-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .res-code { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--blue); flex-shrink: 0; }
  .res-nm { font-size: 16px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res-sub { margin-top: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
  .res-ret { font-family: var(--mono); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .res-add {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--blue);
    display: flex; align-items: center; justify-content: center; color: var(--blue);
  }
  .res-add.added { width: auto; padding: 0 11px; border-color: var(--hair); color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
  .res-section { display: flex; align-items: center; gap: 7px; padding: 14px 16px 8px; font-size: 12px; font-weight: 500; color: var(--text-2); letter-spacing: .5px; }
  .res-section-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sev-warn); box-shadow: 0 0 6px var(--sev-warn); }
  .no-result { text-align: center; color: var(--text-2); padding: 54px 20px; font-size: 14.5px; line-height: 1.8; }
  .no-result span { color: var(--text-3); font-size: 12.5px; }

  /* ── keyframes ───────────────────────────────────────────── */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinc { from { transform: translate(-50%,-50%) rotate(0); } to { transform: translate(-50%,-50%) rotate(360deg); } }
  @keyframes ping { 0% { transform: scale(1); opacity: .5; } 80%,100% { transform: scale(2.4); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheetup { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes detailin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes rowflash { 0% { background: rgba(47,129,247,0.22); } 100% { background: var(--bg); } }
  @keyframes blip { 0%,100% { opacity: .3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .7; } }

  .r-placeholder {
    font-family: var(--mono); font-size: 15px; color: var(--text-3);
    animation: pulse 1.4s ease-in-out infinite; letter-spacing: .5px;
  }
  .r-err { font-family: var(--mono); font-size: 11px; color: var(--sev-bad); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // ── 交易時段判斷 ──────────────────────────────────────────
    function isTradingHours(d = new Date()) {
      const day = d.getDay(); // 0=Sun, 6=Sat
      if (day === 0 || day === 6) return false;
      const total = d.getHours() * 60 + d.getMinutes();
      return total >= 9 * 60 && total <= 13 * 60 + 30;
    }

    // ── 計算輔助函式 ──────────────────────────────────────────
    function retracement(stock) {
      return ((stock.price - stock.high5) / stock.high5) * 100;
    }
    function severity(mag) {
      if (mag < 5) return 'mild';
      if (mag < 15) return 'warn';
      return 'bad';
    }
    const SEV_COLOR = {
      mild: 'var(--sev-mild)',
      warn: 'var(--sev-warn)',
      bad:  'var(--sev-bad)',
    };
    function nextLevel(stock) {
      const mag = Math.abs(retracement(stock));
      let pct = Math.ceil((mag + 1e-9) / 5) * 5;
      if (Math.abs(pct - mag) < 1e-6) pct += 5;
      pct = Math.min(pct, 95);
      const price = stock.high5 * (1 - pct / 100);
      return { pct, price, sev: severity(pct) };
    }
    function fmt(n, dec = 2) {
      const neg = n < 0;
      const s = Math.abs(n).toLocaleString('en-US', {
        minimumFractionDigits: dec, maximumFractionDigits: dec,
      });
      return (neg ? '−' : '') + s;
    }
    function fmtPct(n, dec = 1) {
      const sign = n > 0 ? '+' : n < 0 ? '−' : '';
      return sign + Math.abs(n).toFixed(dec) + '%';
    }

    // ── API & 快取 ────────────────────────────────────────────
    const API_BASE = '/api/chart';
    const LS_LIST  = 'radar_list';
    const LS_DATA  = 'radar_data';
    const WEEK_MS  = 7 * 24 * 60 * 60 * 1000;

    function lsGet(k)    { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

    function loadSavedData() { return lsGet(LS_DATA) || {}; }
    function saveAllData(m)  { lsSet(LS_DATA, m); }
    function loadSavedList() { return lsGet(LS_LIST); }
    function saveList(list)  { lsSet(LS_LIST, list.map(({ code, name }) => ({ code, name }))); }

    // 3 年日線資料 → high5（還原股價）、hd、現價、今日漲跌
    async function fetchFull(code) {
      const res = await fetch(`${API_BASE}/${code}.TW?range=3y&interval=1d`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (json.chart?.error) throw new Error(json.chart.error.description || 'API error');
      const r = json.chart.result[0];
      if (!r) throw new Error('no data');

      const ts       = r.timestamp;
      const adjcl    = r.indicators.adjclose[0].adjclose;
      const closes   = r.indicators.quote[0].close;
      const highs    = r.indicators.quote[0].high;

      // 3 年高點：用盤中最高價 × 還原係數（adjclose/close）
      // 比只看 adjclose 更精確，可抓到當日最高點而非收盤價
      let high5 = 0, hIdx = 0;
      for (let i = 0; i < highs.length; i++) {
        if (highs[i] !== null && closes[i] && adjcl[i]) {
          const adjH = highs[i] * (adjcl[i] / closes[i]);
          if (adjH > high5) { high5 = adjH; hIdx = i; }
        }
      }
      high5 = +high5.toFixed(2);

      // 高點日期
      const dt = new Date(ts[hIdx] * 1000);
      const hd = `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;

      // 最新收盤 + 今日漲跌
      let price = 0, prev = 0, cnt = 0;
      for (let i = closes.length - 1; i >= 0; i--) {
        if (closes[i] !== null) {
          if (cnt === 0) price = closes[i];
          else if (cnt === 1) { prev = closes[i]; break; }
          cnt++;
        }
      }
      price = +price.toFixed(2);
      const day = prev ? +((price - prev) / prev * 100).toFixed(2) : 0;

      return { high5, hd, price, day, _full3yAt: Date.now() };
    }

    // 5 日資料 → 只取現價 + 今日漲跌（快）
    async function fetchPrice(code) {
      const res = await fetch(`${API_BASE}/${code}.TW?range=5d&interval=1d`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (json.chart?.error) throw new Error(json.chart.error.description || 'API error');
      const r = json.chart.result[0];
      if (!r) throw new Error('no data');

      const closes = r.indicators.quote[0].close;
      let price = 0, prev = 0, cnt = 0;
      for (let i = closes.length - 1; i >= 0; i--) {
        if (closes[i] !== null) {
          if (cnt === 0) price = closes[i];
          else if (cnt === 1) { prev = closes[i]; break; }
          cnt++;
        }
      }
      price = +price.toFixed(2);
      const day = prev ? +((price - prev) / prev * 100).toFixed(2) : 0;
      return { price, day };
    }

    // 從 Yahoo Finance 取得股票名稱（供直接新增未知代號使用）
    async function fetchStockMeta(code) {
      const res = await fetch(`${API_BASE}/${code}.TW?range=1d&interval=1d`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (json.chart?.error) throw new Error('找不到此代號');
      const r = json.chart?.result?.[0];
      if (!r) throw new Error('no data');
      const short = r.meta.shortName || '';
      const long  = r.meta.longName  || '';
      // shortName 有時是基金公司名稱而非產品名，偏好 longName
      const looksLikeMgmt = /management|asset|co\.?\s*ltd|securities/i.test(short);
      const raw = (!looksLikeMgmt && short) ? short : (long || short || code);
      const name = raw.replace(/\s+(Co\.,?\s*Ltd\.?|Inc\.?|Corp\.?)$/i, '').trim() || code;
      return { code, name };
    }

    // ── 台股官方完整清單（證交所上市 + 櫃買上櫃）──────────────
    // 來源：openapi.twse.com.tw / tpex.org.tw，含全部股票與 ETF 的中文名
    // 同一份資料附帶成交金額，可排序出「前日熱門」
    const LS_STOCKS    = 'radar_stocks';
    const LS_HOT       = 'radar_hot';
    const LS_STOCKS_AT = 'radar_stocks_at';
    const DAY_MS       = 24 * 60 * 60 * 1000;

    // 從官方 OpenAPI 抓取 → { list: 完整清單, hot: 前日熱門前10 }
    async function fetchStockData() {
      const [twse, tpex] = await Promise.allSettled([
        fetch('/api/twse-list').then(r => r.ok ? r.json() : []),
        fetch('/api/tpex-list').then(r => r.ok ? r.json() : []),
      ]);
      const all = [], seen = new Set();
      const push = (code, name, val) => {
        code = String(code || '').trim();
        name = String(name || '').trim();
        if (code && name && !seen.has(code)) {
          seen.add(code);
          all.push({ code, name, val: Number(val) || 0 });
        }
      };
      // TWSE：TradeValue 成交金額 ／ TPEx：TransactionAmount 成交金額
      if (twse.status === 'fulfilled' && Array.isArray(twse.value))
        twse.value.forEach(x => push(x.Code, x.Name, x.TradeValue));
      if (tpex.status === 'fulfilled' && Array.isArray(tpex.value))
        tpex.value.forEach(x => push(x.SecuritiesCompanyCode, x.CompanyName, x.TransactionAmount));

      const list = all.map(({ code, name }) => ({ code, name }));
      const hot  = all.slice()
        .sort((a, b) => b.val - a.val)
        .slice(0, 10)
        .map(({ code, name }) => ({ code, name }));
      return { list, hot };
    }

    // 載入：優先用每日快取，過期或無快取才重新抓取
    async function loadStockData() {
      const cachedList = lsGet(LS_STOCKS);
      const cachedHot  = lsGet(LS_HOT) || [];
      const at         = lsGet(LS_STOCKS_AT) || 0;
      if (cachedList?.length && (Date.now() - at < DAY_MS))
        return { list: cachedList, hot: cachedHot };
      try {
        const fresh = await fetchStockData();
        if (fresh.list.length) {
          lsSet(LS_STOCKS, fresh.list);
          lsSet(LS_HOT, fresh.hot);
          lsSet(LS_STOCKS_AT, Date.now());
          return fresh;
        }
      } catch {}
      return { list: cachedList || [], hot: cachedHot };
    }

    // 本地搜尋：代號前綴優先（依代號排序），其次名稱包含
    function searchStocks(list, q) {
      const query = q.trim();
      if (!query) return [];
      const lq = query.toLowerCase();
      const byCode = [], byName = [];
      for (const s of list) {
        if (s.code.toLowerCase().startsWith(lq)) byCode.push(s);
        else if (s.name.includes(query)) byName.push(s);
      }
      byCode.sort((a, b) => a.code.localeCompare(b.code));
      return [...byCode, ...byName].slice(0, 80);
    }

    // 初始清單：完全來自 localStorage；無自選清單時回傳空陣列（顯示引導畫面）
    function buildInitialList() {
      const saved = loadSavedList();
      if (!saved?.length) return [];
      const data = loadSavedData();
      return saved.map(({ code, name }) => {
        const d = data[code];
        if (d?.high5 && d?.price) return { code, name, ...d, _loading: false, _err: false };
        return { code, name, high5: 0, hd: '–', price: 0, day: 0, _loading: true, _err: false };
      });
    }

        grip:     <><circle cx="7" cy="6" r="1.3" fill={stroke} stroke="none"/><circle cx="13" cy="6" r="1.3" fill={stroke} stroke="none"/><circle cx="7" cy="10" r="1.3" fill={stroke} stroke="none"/><circle cx="13" cy="10" r="1.3" fill={stroke} stroke="none"/><circle cx="7" cy="14" r="1.3" fill={stroke} stroke="none"/><circle cx="13" cy="14" r="1.3" fill={stroke} stroke="none"/></>,

    // ── Row ───────────────────────────────────────────────────
    function Row({ stock, expanded, dragging, flash, registerFace }) {
      const isLoading = stock._loading;
      const hasData   = !isLoading && stock.price > 0 && stock.high5 > 0;
      const ret     = hasData ? retracement(stock) : 0;
      const mag     = Math.abs(ret);
      const sev     = severity(mag);
      const nl      = hasData ? nextLevel(stock) : null;
      const dropAmt = hasData ? stock.high5 - stock.price : 0;
      const maxLvl = nl ? Math.max(35, nl.pct + 10) : 35;
      const levels = [];
      for (let l = 5; l <= maxLvl; l += 5) levels.push(l);

      return (
        <div className={'row' + (dragging ? ' dragging' : '') + (flash ? ' flash' : '')} data-row-id={stock.code}>
          <div className="row-delete">
            <span><Icon name="trash" size={18} sw={1.9} /> 刪除</span>
          </div>
          <div className="row-face" ref={(el) => registerFace(stock.code, el)}>
            <div className="row-top">
              <span className="drag-grip"><Icon name="grip" size={18} stroke="var(--text-3)" /></span>

              {/* 第一行：代號 + 名稱 + 外開連結 */}
              <div className="r-header">
                <span className="r-code">{stock.code}</span>
                <span className="r-nm">{stock.name}</span>
                <a className="ext-link"
                   href={`https://tw.stock.yahoo.com/quote/${stock.code}.TW`}
                   target="_blank" rel="noopener noreferrer"
                   aria-label="開啟 Yahoo 股市"
                   onClick={(e) => e.stopPropagation()}>
                  <Icon name="external" size={13} sw={1.7} stroke="currentColor" />
                </a>
              </div>

              {/* 第二行：3年高 / 現價回檔 / 下一關卡 */}
              <div className="r-data">

                {/* 第一欄：3年高 */}
                <div className="r-sub">
                  <div className="r-col-lbl">3年高</div>
                  <div className="r-sub-val">{stock.high5 > 0 ? fmt(stock.high5) : '──'}</div>
                </div>

                {/* 第二欄：現價 */}
                <div className="r-price">
                  <div className="r-col-lbl">現價</div>
                  {isLoading ? (
                    <div className="r-placeholder">── ──</div>
                  ) : stock._err ? (
                    <div className="r-err">無法取得</div>
                  ) : (
                    <>
                      <div className="r-now">{fmt(stock.price)}</div>
                      <div className="r-ret" style={{ color: SEV_COLOR[sev] }}>{fmtPct(ret)}</div>
                    </>
                  )}
                </div>

                {/* 第三欄：下一關卡 */}
                <div className="r-next">
                  <div className="r-col-lbl">下一關卡</div>
                  {isLoading ? (
                    <div className="r-placeholder" style={{ fontSize: 12 }}>載入中…</div>
                  ) : stock._err ? null : nl ? (
                    <>
                      <div className="r-next-price">{fmt(nl.price)}</div>
                      <div className="r-next-pct" style={{ color: SEV_COLOR[nl.sev] }}>{fmtPct(-nl.pct, 0)}</div>
                    </>
                  ) : null}
                </div>

              </div>
            </div>

            {expanded && hasData && (
              <div className="row-detail">
                <div className="detail-stats">
                  <div className="ds-item">
                    <span className="ds-k">距 3 年高點</span>
                    <span className="ds-v" style={{ color: SEV_COLOR[sev] }}>{fmtPct(ret)} · {fmt(dropAmt)}</span>
                  </div>
                  <div className="ds-item">
                    <span className="ds-k">高點日期</span>
                    <span className="ds-v">{stock.hd}</span>
                  </div>
                  <div className="ds-item">
                    <span className="ds-k">今日</span>
                    <span className="ds-v" style={{ color: stock.day > 0 ? 'var(--up)' : stock.day < 0 ? 'var(--down)' : 'var(--text-2)' }}>
                      {fmtPct(stock.day, 2)}
                    </span>
                  </div>
                  <div className="ds-item">
                    <span className="ds-k">距下一關卡</span>
                    <span className="ds-v">{fmt(stock.price - nl.price)}</span>
                  </div>
                </div>
                <div className="ladder">
                  {levels.map((l) => {
                    const passed = mag >= l - 1e-6;
                    const isNext = l === nl.pct;
                    return (
                      <span key={l} className={'lad' + (passed ? ' passed' : '') + (isNext ? ' next' : '')}>
                        −{l}%
                      </span>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── WatchList ─────────────────────────────────────────────
    function WatchList({ list, setList, onPulled, refreshing, flashId }) {
      const [expandedId, setExpandedId] = useState(null);
      const [openId, setOpenId] = useState(null);
      const [draggingId, setDraggingId] = useState(null);
      const [pull, setPull] = useState(0);

      const scrollRef = useRef(null);
      const faces = useRef(new Map());
      const orderRef = useRef(list);
      const g = useRef({});
      const lp = useRef(null);

      useEffect(() => { orderRef.current = list; }, [list]);

      const registerFace = useCallback((id, el) => {
        if (el) faces.current.set(id, el); else faces.current.delete(id);
      }, []);

      const faceOf = (id) => faces.current.get(id);
      const ROWH = () => {
        const el = faceOf(orderRef.current[0]?.code);
        return el ? el.getBoundingClientRect().height : 62;
      };

      const setFaceX = (id, x, withTransition) => {
        const el = faceOf(id); if (!el) return;
        el.style.transition = withTransition ? 'transform .22s cubic-bezier(.2,.8,.2,1)' : 'none';
        el.style.transform = `translateX(${x}px)`;
      };

      const clearLP = () => { if (lp.current) { clearTimeout(lp.current); lp.current = null; } };

      const startDrag = () => {
        const s = g.current;
        s.mode = 'drag';
        setExpandedId(null);
        setOpenId(null);
        s.startIndex = orderRef.current.findIndex((x) => x.code === s.rowId);
        s.rowH = ROWH();
        setDraggingId(s.rowId);
        try { scrollRef.current.setPointerCapture(s.pointerId); } catch (_) {}
        if (navigator.vibrate) navigator.vibrate(8);
      };

      const onDown = (e) => {
        if (e.target.closest('.row-delete') || e.target.closest('.ext-link')) { g.current = {}; return; }
        const rowEl = e.target.closest('[data-row-id]');
        g.current = {
          x0: e.clientX, y0: e.clientY, t0: Date.now(),
          rowId: rowEl ? rowEl.getAttribute('data-row-id') : null,
          scroll0: scrollRef.current.scrollTop,
          mode: null, pointerId: e.pointerId,
        };
        clearLP();
        if (g.current.rowId) {
          lp.current = setTimeout(() => {
            if (g.current.mode == null) startDrag();
          }, 260);
        }
      };

      const onMove = (e) => {
        const s = g.current; if (!s) return;
        const dx = e.clientX - s.x0, dy = e.clientY - s.y0;
        if (s.mode == null) {
          if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
          clearLP();
          const atTop = scrollRef.current.scrollTop <= 0.5;
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8 && s.rowId) {
            s.mode = 'swipe';
            try { scrollRef.current.setPointerCapture(s.pointerId); } catch (_) {}
          } else if (dy > 0 && atTop && !refreshing) {
            s.mode = 'pull';
            try { scrollRef.current.setPointerCapture(s.pointerId); } catch (_) {}
          } else {
            s.mode = 'scroll';
          }
        }
        if (s.mode === 'scroll') return;
        e.preventDefault();
        if (s.mode === 'swipe') {
          const base = openId === s.rowId ? -88 : 0;
          const x = Math.max(-120, Math.min(8, dx + base));
          setFaceX(s.rowId, x, false);
        } else if (s.mode === 'pull') {
          const p = Math.max(0, Math.min(110, dy * 0.55));
          setPull(p);
        } else if (s.mode === 'drag') {
          const order = orderRef.current;
          const n = order.length;
          const curIdx = order.findIndex((x) => x.code === s.rowId);
          const desiredTop = s.startIndex * s.rowH + dy;
          const ty = desiredTop - curIdx * s.rowH;
          const el = faceOf(s.rowId);
          if (el) { el.style.transition = 'none'; el.style.transform = `translateY(${ty}px)`; }
          let newIdx = Math.round(desiredTop / s.rowH);
          newIdx = Math.max(0, Math.min(n - 1, newIdx));
          if (newIdx !== curIdx) {
            const next = order.slice();
            const [it] = next.splice(curIdx, 1);
            next.splice(newIdx, 0, it);
            orderRef.current = next;
            setList(next);
          }
        }
      };

      const settleFace = (id, x) => setFaceX(id, x, true);

      const onUp = (e) => {
        const s = g.current; clearLP();
        try { scrollRef.current.releasePointerCapture(s.pointerId); } catch (_) {}
        if (s.mode === 'drag') {
          const el = faceOf(s.rowId);
          if (el) { el.style.transition = 'transform .2s'; el.style.transform = 'translateY(0px)'; }
          setDraggingId(null);
        } else if (s.mode === 'swipe') {
          const dx = e.clientX - s.x0;
          const base = openId === s.rowId ? -88 : 0;
          const x = dx + base;
          if (x < -150) { animateDelete(s.rowId); }
          else if (x < -44) { setOpenId(s.rowId); settleFace(s.rowId, -88); }
          else { setOpenId(null); settleFace(s.rowId, 0); }
        } else if (s.mode === 'pull') {
          if (pull >= 62) onPulled();
          setPull(0);
        } else {
          const moved = Math.abs(e.clientX - s.x0) + Math.abs(e.clientY - s.y0);
          if (moved < 10) {
            if (openId) { settleFace(openId, 0); setOpenId(null); }
            else if (s.rowId) { setExpandedId((id) => (id === s.rowId ? null : s.rowId)); }
          }
        }
        g.current = {};
      };

      const animateDelete = (id) => {
        const el = faceOf(id);
        if (el) { el.style.transition = 'transform .2s ease-in'; el.style.transform = 'translateX(-110%)'; }
        setTimeout(() => {
          setList(orderRef.current.filter((x) => x.code !== id));
          setOpenId(null);
        }, 180);
      };

      useEffect(() => {
        list.forEach((s) => {
          if (draggingId === s.code) return;
          const x = openId === s.code ? -88 : 0;
          const el = faceOf(s.code);
          if (el) { el.style.transition = 'transform .22s cubic-bezier(.2,.8,.2,1)'; el.style.transform = `translateX(${x}px)`; }
        });
      }, [list, openId, draggingId]);

      return (
        <div className="scroll" ref={scrollRef}
          style={{ overflowY: draggingId || pull ? 'hidden' : 'auto' }}
          onPointerDown={onDown} onPointerMove={onMove}
          onPointerUp={onUp} onPointerCancel={onUp}>
          <div className="ptr" style={{ height: pull, opacity: pull / 70 }}>
            <span className={'ptr-radar' + (pull >= 62 ? ' ready' : '')} style={{ transform: `rotate(${pull * 3}deg)` }} />
            <span className="ptr-text">{pull >= 62 ? '放開即更新' : '下拉更新'}</span>
          </div>
          <div className="list-inner">
            {list.map((s) => (
              <div key={s.code} className="row-wrap"
                onClickCapture={(ev) => {
                  if (ev.target.closest('.row-delete')) { ev.stopPropagation(); animateDelete(s.code); }
                }}>
                <Row stock={s} expanded={expandedId === s.code}
                  dragging={draggingId === s.code}
                  flash={flashId === s.code}
                  registerFace={registerFace} />
              </div>
            ))}
            <div className="list-foot">{list.length} 檔自選・長按拖曳排序・左滑刪除</div>
          </div>
        </div>
      );
    }

    // ── EmptyState ────────────────────────────────────────────
    function EmptyState({ onAdd }) {
      return (
        <div className="empty">
          <div className="empty-radar">
            <span className="er-ring er-r1" />
            <span className="er-ring er-r2" />
            <span className="er-ring er-r3" />
            <span className="er-sweep" />
            <span className="er-core" />
            <span className="er-blip er-b1" />
            <span className="er-blip er-b2" />
          </div>
          <h2 className="empty-title">開始追蹤回檔</h2>
          <p className="empty-sub">
            加入你的台股自選清單，<br />
            即時掌握距 3 年高點的回檔幅度，<br />
            與下一個關鍵關卡價位。
          </p>
          <button className="empty-cta" onClick={onAdd}>
            <Icon name="plus" size={20} sw={2.2} stroke="#fff" />
            新增第一支股票
          </button>
          <div className="empty-hint">支援代號或名稱搜尋・無上限</div>
        </div>
      );
    }

    // ── SearchSheet ───────────────────────────────────────────
    function SearchSheet({ stockList, popular, listLoading, inList, onAdd, onClose }) {
      const [q, setQ]                   = useState('');
      const [added, setAdded]           = useState(new Set());
      const [directLoading, setDirectLoading] = useState(false);
      const [directErr, setDirectErr]   = useState('');
      const inputRef = useRef(null);

      useEffect(() => {
        const t = setTimeout(() => inputRef.current && inputRef.current.focus(), 280);
        return () => clearTimeout(t);
      }, []);

      const query   = q.trim();
      // 本地即時搜尋官方完整清單；無輸入時顯示熱門推薦
      const results = query ? searchStocks(stockList, query) : popular;

      const looksLikeCode = /^\d{4,6}[A-Za-z]{0,2}$/.test(query);
      const alreadyIn     = inList.has(query) || added.has(query);
      const empty         = query && results.length === 0;
      const showLoading   = empty && listLoading;                       // 清單載入中
      const showDirectAdd = empty && !listLoading && looksLikeCode && !alreadyIn;
      const showAlreadyIn = empty && !listLoading && looksLikeCode && alreadyIn;
      const showNoResult  = empty && !listLoading && !looksLikeCode;

      const handleAdd = (s) => {
        onAdd(s);
        setAdded(prev => new Set(prev).add(s.code));
      };

      const handleDirectAdd = async () => {
        if (directLoading) return;
        setDirectLoading(true); setDirectErr('');
        try {
          const meta = await fetchStockMeta(query);
          onAdd({ ...meta, high5: 0, hd: '–', price: 0, day: 0 });
          setAdded(prev => new Set(prev).add(query));
        } catch {
          setDirectErr('找不到此代號，請確認後再試');
          setTimeout(() => setDirectErr(''), 2500);
        }
        setDirectLoading(false);
      };

      return (
        <div className="sheet-scrim" onClick={onClose}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div className="sheet-grab" />
            <div className="sheet-head">
              <div className="search-box">
                <Icon name="search" size={18} stroke="var(--text-2)" />
                <input ref={inputRef} className="search-input"
                  placeholder="輸入代號（2330）或名稱（台積）"
                  value={q} onChange={(e) => setQ(e.target.value)}
                  inputMode="search" />
                {q && <button className="search-clear" onClick={() => setQ('')} aria-label="清除">✕</button>}
              </div>
              <button className="sheet-cancel" onClick={onClose}>取消</button>
            </div>
            <div className="results">

              {/* 前日熱門標題（無輸入且已載入） */}
              {!query && results.length > 0 && (
                <div className="res-section">
                  <span className="res-section-dot" />前日熱門
                </div>
              )}

              {/* 無輸入且熱門尚未載入 → 提示 */}
              {!query && results.length === 0 && (
                <div className="no-result" style={{ paddingTop: 48 }}>
                  {listLoading ? '載入前日熱門中…' : '輸入代號或名稱開始搜尋'}<br />
                  <span>上市・上櫃股票與 ETF</span>
                </div>
              )}

              {/* 搜尋中清單尚未載入 */}
              {showLoading && (
                <div className="no-result" style={{ color: 'var(--text-3)', paddingTop: 40 }}>載入股票清單中…</div>
              )}

              {/* 找不到且不像代號 */}
              {showNoResult && (
                <div className="no-result">
                  找不到「{query}」<br />
                  <span>試試股票代號或公司名稱</span>
                </div>
              )}

              {/* 代號已在清單 */}
              {showAlreadyIn && (
                <div className="no-result">{query} 已在自選清單</div>
              )}

              {/* 直接新增（官方清單找不到時的後備） */}
              {showDirectAdd && (
                <>
                  <button className="res-row" onClick={handleDirectAdd} disabled={directLoading}>
                    <div>
                      <div className="res-line">
                        <span className="res-code">{query}</span>
                        <span className="res-nm" style={{ color: 'var(--text-2)' }}>
                          {directLoading ? '查詢中…' : '直接新增此代號'}
                        </span>
                      </div>
                      <div className="res-sub">從 Yahoo 股市取得名稱與資料</div>
                    </div>
                    <span />
                    <span className="res-add">
                      {directLoading
                        ? <span style={{ color: 'var(--text-3)', fontSize: 13 }}>…</span>
                        : <Icon name="plus" size={18} sw={2.2} stroke="var(--blue)" />}
                    </span>
                  </button>
                  {directErr && (
                    <div className="no-result" style={{ paddingTop: 16, color: 'var(--sev-bad)' }}>{directErr}</div>
                  )}
                </>
              )}

              {/* 搜尋結果 / 熱門推薦 */}
              {results.map((s) => {
                const isIn = inList.has(s.code) || added.has(s.code);
                return (
                  <button key={s.code} className="res-row" disabled={isIn}
                    onClick={() => !isIn && handleAdd(s)}>
                    <div>
                      <div className="res-line">
                        <span className="res-code">{s.code}</span>
                        <span className="res-nm">{s.name}</span>
                      </div>
                    </div>
                    <span />
                    <span className={'res-add' + (isIn ? ' added' : '')}>
                      {isIn ? '已加入' : <Icon name="plus" size={18} sw={2.2} stroke="var(--blue)" />}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ── RadarApp ──────────────────────────────────────────────
    function RadarApp() {
      const [list, setList]           = useState(buildInitialList);
      const [now, setNow]             = useState(() => new Date());
      const [refreshing, setRefreshing] = useState(false);
      const [searchOpen, setSearchOpen] = useState(false);
      const [flash, setFlash]         = useState(null);
      const [stockList, setStockList] = useState(() => lsGet(LS_STOCKS) || []);
      const [hotList, setHotList]     = useState(() => lsGet(LS_HOT) || []);
      const [listLoading, setListLoading] = useState(false);
      const dataRef = useRef(loadSavedData());

      // 載入台股官方完整清單（供搜尋）與前日熱門前 10，每日快取
      useEffect(() => {
        let alive = true;
        setListLoading(true);
        loadStockData().then(({ list, hot }) => {
          if (alive) { setStockList(list); setHotList(hot); setListLoading(false); }
        });
        return () => { alive = false; };
      }, []);

      // 更新單一股票資料並寫入快取
      const updateStock = useCallback((code, patch) => {
        setList(prev => prev.map(s =>
          s.code === code ? { ...s, ...patch, _loading: false, _err: false } : s
        ));
        dataRef.current = { ...dataRef.current, [code]: { ...(dataRef.current[code] || {}), ...patch } };
        saveAllData(dataRef.current);
      }, []);

      const markErr = useCallback((code) => {
        setList(prev => prev.map(s => s.code === code ? { ...s, _loading: false, _err: true } : s));
      }, []);

      // 對一組 code 抓取資料
      const fetchCodes = useCallback((codes) => {
        return Promise.allSettled(codes.map(code => {
          const cached = dataRef.current[code];
          const needFull = !cached?.high5 || (Date.now() - (cached._full3yAt || 0) > WEEK_MS);
          const fn = needFull ? fetchFull : fetchPrice;
          return fn(code)
            .then(d => updateStock(code, d))
            .catch(() => markErr(code));
        }));
      }, [updateStock, markErr]);

      // 儲存清單順序
      useEffect(() => { saveList(list); }, [list]);

      // 初始載入：抓取所有需要更新的股票
      useEffect(() => {
        const codes = list.map(s => s.code);
        fetchCodes(codes);
      }, []); // 只執行一次

      // 手動 / 自動刷新
      const doRefresh = useCallback(() => {
        if (refreshing) return;
        setRefreshing(true);
        // 每次刷新時，過期的 5y 資料也一起更新
        const codes = list.map(s => s.code);
        fetchCodes(codes).then(() => {
          setNow(new Date());
          setRefreshing(false);
        });
      }, [refreshing, list, fetchCodes]);

      // 每 5 分鐘在交易時間內自動刷新
      useEffect(() => {
        const id = setInterval(() => {
          if (isTradingHours()) doRefresh();
        }, 5 * 60 * 1000);
        return () => clearInterval(id);
      }, [doRefresh]);

      // 新增股票：加到清單最後，立即抓取資料
      const addStock = useCallback((stock) => {
        setList(prev => {
          if (prev.some(x => x.code === stock.code)) return prev;
          return [...prev, { ...stock, _loading: true, _err: false }];
        });

        const cached = dataRef.current[stock.code];
        const needFull = !cached?.high5 || (Date.now() - (cached._full3yAt || 0) > WEEK_MS);
        (needFull ? fetchFull(stock.code) : fetchPrice(stock.code))
          .then(d => updateStock(stock.code, d))
          .catch(() => markErr(stock.code));

        setFlash(stock.code);
        setTimeout(() => setFlash(null), 1400);
      }, [updateStock, markErr]);

      const codes = new Set(list.map(x => x.code));

      return (
        <div className="app">
          <header className="appbar">
            <div className="appbar-row">
              <div className="brand">
                <span className="brand-mark"><span className="bm-dot" /></span>
                <h1>回檔雷達</h1>
              </div>
              <button className="add-btn" onClick={() => setSearchOpen(true)} aria-label="新增股票">
                <Icon name="plus" size={18} sw={2.6} stroke="#fff" />
              </button>
            </div>
            <StatusBar now={now} />
          </header>

          {list.length === 0
            ? <EmptyState onAdd={() => setSearchOpen(true)} />
            : <WatchList list={list} setList={setList} onPulled={doRefresh} refreshing={refreshing} flashId={flash} />
          }

          {searchOpen && (
            <SearchSheet stockList={stockList} popular={hotList}
              listLoading={listLoading} inList={codes}
              onAdd={addStock} onClose={() => setSearchOpen(false)} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RadarApp />);
  </script>
</body>
</html>
